name: Build figtoapk Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App display name
        required: true
        type: string
      package_name:
        description: Android package ID
        required: true
        type: string
      zip_url:
        description: HTTPS URL to a ZIP stored in Vercel Blob (leave blank for Figma link)
        required: false
        type: string
      figma_url:
        description: Figma file/design URL (leave blank for ZIP)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: figtoapk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in $SDK/cmdline-tools"
            find "$SDK" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK"
          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Installed Android packages:"
          sdkmanager --list_installed

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install worker Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r builder/requirements.txt

      - name: Validate inputs
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          FIGMA_URL: ${{ inputs.figma_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail

          if [ -z "$APP_NAME" ]; then
            echo "::error::App name is required."
            exit 1
          fi

          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Package name is required."
            exit 1
          fi

          if [ -z "$ZIP_URL" ] && [ -z "$FIGMA_URL" ]; then
            echo "::error::Provide either a ZIP URL or a Figma URL."
            exit 1
          fi

          if [ -n "$ZIP_URL" ] && [ -n "$FIGMA_URL" ]; then
            echo "::error::Provide a ZIP URL or a Figma URL, not both."
            exit 1
          fi

      - name: Generate Android project and build APK
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          FIGMA_URL: ${{ inputs.figma_url }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euo pipefail
          python builder/build_cli.py

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build-output/figtoapk.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated or is empty: $APK"
            echo "Available build output:"
            find build-output -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Publish APK as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ inputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="figtoapk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" \
            build-output/figtoapk.apk \
            --title "figtoapk build: ${APP_NAME} (${GITHUB_RUN_ID})" \
            --notes "Generated by figtoapk GitHub Actions. This is a debug APK for testing, not a Play Store release build."