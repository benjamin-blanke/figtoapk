
name: Build figtoapk Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App display name
        required: true
        type: string
      package_name:
        description: Android package ID
        required: true
        type: string
      zip_url:
        description: HTTPS URL to a ZIP stored in Vercel Blob (leave blank for Figma link)
        required: false
        type: string
      figma_url:
        description: Figma file/design URL (leave blank for ZIP)
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: figtoapk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install worker Python dependencies
        run: python -m pip install -r builder/requirements.txt

      - name: Generate Android project and build APK
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          FIGMA_URL: ${{ inputs.figma_url }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: python builder/build_cli.py

      - name: Publish APK as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          TAG="figtoapk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" build-output/figtoapk.apk \
            --title "figtoapk build: ${APP_NAME} (${GITHUB_RUN_ID})" \
            --notes "Generated by figtoapk GitHub Actions. This is a debug APK for testing, not a Play Store release build."
